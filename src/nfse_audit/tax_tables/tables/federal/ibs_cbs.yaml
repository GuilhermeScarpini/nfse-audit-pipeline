id: ibs_cbs
description: IBS and CBS highlighted on the invoice (tax reform, transition years)
versions:
  - valid_from: 2026-01-01
    valid_to: 2026-09-30
    legal_basis: "LC 214/2025, arts. 343 (IBS estadual 0,1%) e 346 (CBS 0,9%); compensação com PIS/COFINS: art. 348"
    verified: true
    notes: >-
      Test year. No municipal IBS in 2026. Highlighting on the NFS-e is not yet
      mandatory before 2026-10-01 (Ato Conjunto RFB/CGIBS 4/2026, art. 1º, III).
      vBC = vServ - vISSQN - vPIS - vCOFINS (layout NFS-e v1.01, NT 004).
    params:
      cbs_rate: "0.009"
      ibs_state_rate: "0.001"
      ibs_municipal_rate: "0"
      mandatory: false
      base_deductions: [iss, pis, cofins]
  - valid_from: 2026-10-01
    valid_to: 2026-11-30
    legal_basis: "LC 214/2025, arts. 343, 346 e 348; obrigatoriedade: Ato Conjunto RFB/CGIBS 4/2026, art. 1º, III"
    verified: true
    notes: >-
      Mandatory for general ISS services from 2026-10-01; subitems 1.03, 1.05, 1.09
      and 16.01 only from 2026-12-01. Other late categories (digital platforms,
      condominiums, rentals) are not modeled.
    params:
      cbs_rate: "0.009"
      ibs_state_rate: "0.001"
      ibs_municipal_rate: "0"
      mandatory: true
      optional_subitems: ["01.03", "01.05", "01.09", "16.01"]
      base_deductions: [iss, pis, cofins]
  - valid_from: 2026-12-01
    valid_to: 2026-12-31
    legal_basis: "LC 214/2025, arts. 343, 346 e 348; obrigatoriedade: Ato Conjunto RFB/CGIBS 4/2026, art. 1º, III"
    verified: true
    params:
      cbs_rate: "0.009"
      ibs_state_rate: "0.001"
      ibs_municipal_rate: "0"
      mandatory: true
      base_deductions: [iss, pis, cofins]
  - valid_from: 2027-01-01
    legal_basis: "LC 214/2025, arts. 344 (IBS 0,05% UF + 0,05% municipal) e 347 (CBS = referência - 0,1 p.p.)"
    verified: false
    notes: >-
      PIS/COFINS are extinct (EC 132/2023, ADCT art. 126, II; LC 214/2025, art. 542),
      so vBC = vServ - vISSQN. The CBS reference rate is fixed by a Senate resolution
      that, as of 2026-10-20, has not been published (deadline 2026-12-15, LC 214/2025,
      arts. 349 and 353). Until then CBS rules report an error instead of guessing.
    params:
      cbs_rate: null
      ibs_state_rate: "0.0005"
      ibs_municipal_rate: "0.0005"
      mandatory: true
      base_deductions: [iss]
